name: Cloudflare Speed Test

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download

      - name: Run Cloudflare Speed Test
        run: |
          go run . -n 200 -t 4 -dn 10 -dt 10 -tp 443 -f ip_ranges.txt -o ip.txt -dd

      - name: Upload ip.txt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('ip.txt', 'utf8');
            const encoded = Buffer.from(content).toString('base64');
            
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'ip.txt'
            });
            
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'ip.txt',
              message: 'Update IP list [skip ci]',
              content: encoded,
              sha: file.sha
            });
            
            console.log('ip.txt uploaded successfully');
