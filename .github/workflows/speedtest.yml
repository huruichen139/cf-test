name: Cloudflare Speed Test

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download

      - name: Run Cloudflare Speed Test
        run: |
          go run . -n 200 -t 4 -dn 10 -dt 10 -tp 443 -f ip.txt -o ip.txt -dd

      - name: Upload ip.txt via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w 0 ip.txt)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ github.repository }}/contents/ip.txt" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ github.repository }}/contents/ip.txt" -d "{\"message\":\"Update IP list [skip ci]\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
