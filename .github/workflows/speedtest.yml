name: Cloudflare Speed Test

on:
  schedule:
    # 每天北京时间 8:00 运行 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download

      - name: Run Cloudflare Speed Test
        run: |
          go run . -t 2 -p 443 -f ip.txt -o ip.txt

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ip.txt ipv6.txt
          git commit -m "Update IP list [skip ci]" || echo "No changes to commit"
          git push https://huruichen139:${{ secrets.GH_TOKEN }}@github.com/huruichen139/cf.git master
